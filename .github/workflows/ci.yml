name: CI

on:
  pull_request:
    branches: [mainline]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  vale:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.24.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Vale and its styles
        run: |
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
          vale sync
      - name: Check changed articles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- 'src/content/articles/*.md')
          if [ ${#files[@]} -eq 0 ]; then echo "No articles changed."; exit 0; fi
          vale "${files[@]}"

  commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title and commits follow Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          bad=0
          check() {
            if ! printf '%s\n' "$1" | grep -Eq "$pattern"; then
              echo "::error::Not Conventional Commits format: $1"
              bad=1
            fi
          }
          check "$PR_TITLE"
          while IFS= read -r subject; do check "$subject"; done \
            < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          if [ "$bad" = 1 ]; then
            echo "Use 'type(scope): summary', e.g. 'fix(readme): restore view counter'."
            exit 1
          fi
